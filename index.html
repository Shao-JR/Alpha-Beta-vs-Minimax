  flex-shrink: 0;
}

.toolbar-left .title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text-primary);
}

.toolbar-center {
  display: flex;
  align-items: center;
  gap: 6px;
}

.toolbar-center button {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.toolbar-center button:hover {
  background: var(--bg-panel-hover);
  border-color: var(--accent);
}

.toolbar-center button:active { transform: scale(0.97); }
.toolbar-center button:disabled { opacity: 0.4; cursor: not-allowed; }

.speed-control {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  padding-left: 12px;
  border-left: 1px solid var(--border-color);
}

.speed-label { font-size: 11px; color: var(--text-secondary); }
#speed-slider { width: 80px; accent-color: var(--accent); }

.step-counter {
  font-size: 12px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  color: var(--text-secondary);
  background: var(--bg-deep);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
}

/* ===== Workspace ===== */
#workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

.algo-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-deep);
  min-width: 280px;
  overflow: hidden;
}

#panel-ab {
  flex: none;
  width: 50%;
}

#panel-mm {
  flex: 1;
}

/* Resizable Divider */
.panel-divider {
  width: 6px;
  cursor: col-resize;
  background: var(--border-color);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  transition: background 0.15s ease;
}

.panel-divider:hover,
.panel-divider.dragging {
  background: var(--accent);
}

.panel-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 32px;
  background: var(--text-muted);
  border-radius: 1px;
  transition: background 0.15s ease;
}

.panel-divider:hover::after,
.panel-divider.dragging::after {
  background: var(--bg-deep);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}

.panel-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.ab-badge {
  background: rgba(16, 185, 129, 0.15);
  color: var(--ab-color);
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.mm-badge {
  background: rgba(245, 158, 11, 0.15);
  color: var(--mm-color);
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.panel-stats {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}

.tree-viewport {
  flex: 1;
  overflow: auto;
  position: relative;
  background:
    radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.04) 0%, transparent 60%),
    var(--bg-deep);
}

.tree-viewport svg {
  display: block;
  min-width: 100%;
  min-height: 100%;
}

/* Step Drawer */
.step-drawer {
  flex-shrink: 0;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-color);
  max-height: 180px;
  display: flex;
  flex-direction: column;
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
}

.drawer-toggle {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  padding: 0 4px;
  transition: transform 0.2s ease;
}

.step-drawer.collapsed .drawer-toggle { transform: rotate(-90deg); }
.step-drawer.collapsed .drawer-body { display: none; }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.step-item {
  padding: 4px 12px;
  font-size: 11px;
  line-height: 1.4;
  border-left: 3px solid transparent;
  color: var(--text-secondary);
  transition: all 0.12s ease;
  cursor: pointer;
}

.step-item:hover { background: rgba(255,255,255,0.03); }
.step-item.active {
  background: rgba(16, 185, 129, 0.08);
  border-left-color: var(--accent);
  color: var(--text-primary);
}
.step-item.past { color: var(--text-muted); }

.step-num {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-weight: 600;
  color: var(--accent);
  margin-right: 4px;
}

.step-action { font-weight: 600; }
.action-visit .step-action { color: #60a5fa; }
.action-evaluate .step-action { color: #34d399; }
.action-update .step-action { color: #fbbf24; }
.action-prune .step-action { color: #f87171; }
.action-return .step-action { color: #a78bfa; }

/* ===== Compare Bar ===== */
#compare-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 8px 20px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-color);
  flex-shrink: 0;
}

.compare-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.compare-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.compare-values {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 16px;
  font-weight: 700;
}

.ab-val { color: var(--ab-color); }
.mm-val { color: var(--mm-color); }
.vs { color: var(--text-muted); font-size: 11px; font-weight: 400; }

.compare-item.highlight .efficiency-val {
  font-size: 18px;
  color: var(--ab-color);
}

.compare-hint {
  font-size: 11px;
  color: var(--text-muted);
  max-width: 260px;
  text-align: center;
  line-height: 1.4;
}

/* ===== Value Editor ===== */
#value-editor {
  position: fixed;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}

#value-editor.hidden { display: none; }

#value-input {
  width: 56px;
  height: 30px;
  border: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--bg-panel);
  color: var(--text-primary);
  text-align: center;
  font-size: 13px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  outline: none;
}

#value-input:focus { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3); }

/* ===== SVG Node Styles ===== */
.node-circle {
  transition: all 0.2s ease;
  cursor: default;
}

.node-circle.type-max {
  fill: var(--node-max-bg);
  stroke: var(--node-max);
  stroke-width: 2;
}

.node-circle.type-min {
  fill: var(--node-min-bg);
  stroke: var(--node-min);
  stroke-width: 2;
}

.node-circle.active {
  fill: var(--node-active-bg) !important;
  stroke: var(--node-active) !important;
  stroke-width: 2.5 !important;
  filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.5));
}

.node-circle.pruned {
  fill: var(--node-pruned-bg) !important;
  stroke: var(--node-pruned) !important;
  stroke-width: 1.5 !important;
  stroke-dasharray: 5 3;
  opacity: 0.5;
}

.node-circle.evaluated { stroke-width: 2.5 !important; }

.node-type-text {
  font-size: 9px;
  font-weight: 700;
  fill: var(--text-secondary);
  text-anchor: middle;
  pointer-events: none;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
}

.node-value-text {
  font-size: 13px;
  font-weight: 700;
  fill: var(--text-primary);
  text-anchor: middle;
  pointer-events: none;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}

.node-value-text.leaf {
  cursor: pointer;
  pointer-events: all;
}

.node-value-text.leaf:hover { fill: var(--accent); }

.alpha-text, .beta-text {
  font-size: 9px;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  pointer-events: none;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.alpha-text.visible, .beta-text.visible { opacity: 1; }
.alpha-text { fill: #60a5fa; text-anchor: end; }
.beta-text { fill: #fbbf24; text-anchor: start; }

.computed-value-text {
  font-size: 10px;
  font-weight: 700;
  fill: var(--accent);
  text-anchor: middle;
  pointer-events: none;
  -webkit-user-select: none;
     -moz-user-select: none;
          user-select: none;
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
}

/* Edges */
.tree-edge {
  stroke: var(--edge-color);
  stroke-width: 1.5;
  fill: none;
  transition: all 0.2s ease;
}

.tree-edge.pruned {
  stroke: var(--node-pruned);
  stroke-dasharray: 5 3;
  opacity: 0.35;
}

.tree-edge.active {
  stroke: var(--node-active);
  stroke-width: 2;
}

/* Action buttons */
.action-btn {
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.node-group:hover .action-btn { opacity: 1; }

.action-btn .btn-circle {
  fill: var(--bg-deep);
  stroke: var(--accent);
  stroke-width: 1.5;
  transition: all 0.15s ease;
}

.action-btn:hover .btn-circle { fill: var(--accent); }

.action-btn .btn-text {
  fill: var(--accent);
  font-size: 12px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  transition: fill 0.15s ease;
}

.action-btn:hover .btn-text { fill: var(--bg-deep); }

.action-btn.remove-btn .btn-circle { stroke: var(--danger); }
.action-btn.remove-btn:hover .btn-circle { fill: var(--danger); }
.action-btn.remove-btn .btn-text { fill: var(--danger); }
.action-btn.remove-btn:hover .btn-text { fill: white; }

.add-child-btn {
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.15s ease;
}

.node-group:hover .add-child-btn { opacity: 1; }

.add-child-btn .btn-circle {
  fill: var(--bg-deep);
  stroke: var(--accent);
  stroke-width: 1.5;
  transition: fill 0.15s ease;
}

.add-child-btn:hover .btn-circle { fill: var(--accent); }

.add-child-btn .btn-text {
  fill: var(--accent);
  font-size: 14px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  transition: fill 0.15s ease;
}

.add-child-btn:hover .btn-text { fill: var(--bg-deep); }

/* Level labels */
.level-badge-rect {
  rx: 3;
}

.level-badge-text {
  text-anchor: middle;
  font-size: 9px;
  font-weight: 700;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Pruned strike-through */
.prune-strike {
  stroke: var(--danger);
  stroke-width: 2;
  opacity: 0.6;
}

/* Scrollbars */
.tree-viewport::-webkit-scrollbar,
.drawer-body::-webkit-scrollbar { width: 5px; height: 5px; }
.tree-viewport::-webkit-scrollbar-track,
.drawer-body::-webkit-scrollbar-track { background: var(--bg-deep); }
.tree-viewport::-webkit-scrollbar-thumb,
.drawer-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
.tree-viewport::-webkit-scrollbar-thumb:hover,
.drawer-body::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }</style>

  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-left">
          <h1 class="title">Alpha-Beta vs Minimax</h1>
        </div>
        <div class="toolbar-center">
          <button id="btn-run" title="自动播放对比">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6V2z"/></svg>
            运行对比
          </button>
          <button id="btn-step" title="单步对比">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h3v12H3V2zm6 0l6 6-6 6V2z"/></svg>
            单步
          </button>
          <button id="btn-reset" title="重置">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 110 10A5 5 0 018 3zm0-1a6 6 0 100 12A6 6 0 008 2z"/></svg>
            重置
          </button>
          <div class="speed-control">
            <span class="speed-label">速度</span>
            <input type="range" id="speed-slider" min="100" max="2000" value="500" step="100" />

      <main id="workspace">

        </section>

        <div class="panel-divider" id="panel-divider"></div>

        <!-- Minimax 面板 -->
        <section class="algo-panel" id="panel-mm">
          <div class="panel-header">
            <span class="panel-badge mm-badge">Minimax</span>
            <span class="panel-stats" id="stats-mm">0 步 · 0 节点访问</span>
          </div>
          <div class="tree-viewport" id="viewport-mm">
            <svg id="svg-mm" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div class="step-drawer" id="drawer-mm">
            <div class="drawer-header">
              <span>步骤日志</span>
              <button class="drawer-toggle" data-target="drawer-mm">▾</button>
            </div>
            <div class="drawer-body" id="log-mm"></div>
          </div>
        </section>
      </main>

      <!-- 对比指标条 -->
      <footer id="compare-bar">
        <div class="compare-item">
          <span class="compare-label">算法步骤</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-steps-ab">0</span>
            <span class="vs">vs</span>
            <span class="mm-val" id="cmp-steps-mm">0</span>
          </span>
        </div>
        <div class="compare-item">
          <span class="compare-label">节点访问</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-visited-ab">0</span>
            <span class="vs">vs</span>
            <span class="mm-val" id="cmp-visited-mm">0</span>
          </span>
        </div>
        <div class="compare-item">
          <span class="compare-label">剪枝数</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-pruned-ab">0</span>

    </div>

    <div id="value-editor" class="hidden">
      <input type="number" id="value-input" />
    </div>
