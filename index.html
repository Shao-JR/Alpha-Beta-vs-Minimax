  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-left">
          <h1 class="title">Alpha-Beta vs Minimax</h1>
        </div>
        <div class="toolbar-center">
          <button id="btn-run" title="自动播放对比">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6V2z"/></svg>
            运行对比
          </button>
          <button id="btn-step" title="单步对比">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h3v12H3V2zm6 0l6 6-6 6V2z"/></svg>
            单步
          </button>
          <button id="btn-reset" title="重置">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 110 10A5 5 0 018 3zm0-1a6 6 0 100 12A6 6 0 008 2z"/></svg>
            重置
          </button>
          <div class="speed-control">
            <span class="speed-label">速度</span>
            <input type="range" id="speed-slider" min="100" max="2000" value="500" step="100" />
          </div>
        </div>
        <div class="toolbar-right">
          <span id="step-counter" class="step-counter">步骤: 0 / 0</span>
        </div>
      </header>

      <main id="workspace">
        <!-- Alpha-Beta 面板 -->
        <section class="algo-panel" id="panel-ab">
          <div class="panel-header">
            <span class="panel-badge ab-badge">Alpha-Beta</span>
            <span class="panel-stats" id="stats-ab">0 步 · 0 节点访问 · 0 剪枝</span>
          </div>
          <div class="tree-viewport" id="viewport-ab">
            <svg id="svg-ab" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div class="step-drawer" id="drawer-ab">
            <div class="drawer-header">
              <span>步骤日志</span>
              <button class="drawer-toggle" data-target="drawer-ab">▾</button>
            </div>
            <div class="drawer-body" id="log-ab"></div>
          </div>
        </section>

        <!-- Minimax 面板 -->
        <section class="algo-panel" id="panel-mm">
          <div class="panel-header">
            <span class="panel-badge mm-badge">Minimax</span>
            <span class="panel-stats" id="stats-mm">0 步 · 0 节点访问</span>
          </div>
          <div class="tree-viewport" id="viewport-mm">
            <svg id="svg-mm" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div class="step-drawer" id="drawer-mm">
            <div class="drawer-header">
              <span>步骤日志</span>
              <button class="drawer-toggle" data-target="drawer-mm">▾</button>
            </div>
            <div class="drawer-body" id="log-mm"></div>
          </div>
        </section>
      </main>

      <!-- 对比指标条 -->
      <footer id="compare-bar">
        <div class="compare-item">
          <span class="compare-label">算法步骤</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-steps-ab">0</span>
            <span class="vs">vs</span>
            <span class="mm-val" id="cmp-steps-mm">0</span>
          </span>
        </div>
        <div class="compare-item">
          <span class="compare-label">节点访问</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-visited-ab">0</span>
            <span class="vs">vs</span>
            <span class="mm-val" id="cmp-visited-mm">0</span>
          </span>
        </div>
        <div class="compare-item">
          <span class="compare-label">剪枝数</span>
          <span class="compare-values">
            <span class="ab-val" id="cmp-pruned-ab">0</span>
            <span class="vs">vs</span>
            <span class="mm-val" id="cmp-pruned-mm">0</span>
          </span>
        </div>
        <div class="compare-item highlight">
          <span class="compare-label">效率提升</span>
          <span class="compare-values">
            <span class="efficiency-val" id="cmp-efficiency">—</span>
          </span>
        </div>
        <div class="compare-item">
          <span class="compare-hint">双击叶子节点编辑值 · 悬停节点显示操作按钮</span>
        </div>
      </footer>
    </div>

    <div id="value-editor" class="hidden">
      <input type="number" id="value-input" />
    </div>

  </body>
</html>
